name: Update sponsors

on:
  # 00:00 Asia/Shanghai. GitHub Actions cron expressions use UTC.
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: afdian-sponsors
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Afdian credentials
        env:
          AFDIAN_USER_ID: ${{ secrets.AFDIAN_USER_ID }}
          AFDIAN_API_TOKEN: ${{ secrets.AFDIAN_API_TOKEN }}
        run: |
          if [[ -z "$AFDIAN_USER_ID" || -z "$AFDIAN_API_TOKEN" ]]; then
            echo '::error::Add AFDIAN_USER_ID and AFDIAN_API_TOKEN as repository Actions secrets.'
            exit 1
          fi

      - name: Create output directory
        run: mkdir -p dist

      - name: Generate sponsor image
        # afdian-sponsor v1, pinned to the commit behind its v1 tag.
        uses: Sn0wo2/afdian-sponsor@3ea3ccf0735a56c6b82036c8a13676690532f25d
        with:
          version: latest
          cache: true
        env:
          AFDIAN_USER_ID: ${{ secrets.AFDIAN_USER_ID }}
          AFDIAN_API_TOKEN: ${{ secrets.AFDIAN_API_TOKEN }}
          AFDIAN_OUTPUT: ./dist/afdian-sponsor.svg
          AFDIAN_TOTAL_SPONSORS: 100
          AFDIAN_SORT: time

      - name: Publish sponsor image
        # crazy-max/ghaction-github-pages v5.0.0
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4
        with:
          target_branch: out/sponsor
          build_dir: dist
          commit_message: "ci(sponsor): update sponsor image"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
