name: Release

# Temporary recovery of v1.9.5 using the completed builds, without rebuilding.
on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: release-refs/tags/v1.9.5
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: v1.9.5
    steps:
      - name: Verify the existing release tag
        run: |
          sha=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)
          [ "$sha" = b98e71657e3a92ba8c172c0f29ffbe513ff96657 ]

      - uses: actions/download-artifact@v7
        with:
          run-id: 41211082897
          github-token: ${{ github.token }}
          pattern: QPlayer-*
          path: out
          merge-multiple: true

      - name: Check every expected artifact is present
        run: |
          for f in QPlayer-android.apk QPlayer-linux-x64.AppImage QPlayer-macos-arm64.dmg QPlayer-windows-x64.zip QPlayer-windows-x64-setup.exe; do
            [ -s "out/$f" ] || { echo "::error::missing $f"; exit 1; }
          done
          ls -l out

      - name: Publish complete release
        run: |
          gh release view "$RELEASE_TAG" --json tagName
          gh release upload "$RELEASE_TAG" out/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
