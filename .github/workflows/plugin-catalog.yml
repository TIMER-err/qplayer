name: Publish plugin catalog

on:
  push:
    branches:
      - master
      - feat/plugin-system
    paths:
      - player-core/src/main/resources/plugin-catalog-v1.json

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Publish stable catalog ref
        run: git push --force origin HEAD:refs/heads/plugin-catalog
