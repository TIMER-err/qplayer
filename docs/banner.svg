<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="DejaVu Sans, sans-serif">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#101521"/>
      <stop offset="0.52" stop-color="#171A2C"/>
      <stop offset="1" stop-color="#281A32"/>
    </linearGradient>
    <radialGradient id="blueGlow">
      <stop offset="0" stop-color="#7697EE" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#7697EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pinkGlow">
      <stop offset="0" stop-color="#E48ACD" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#E48ACD" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leftFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#101521" stop-opacity="1"/>
      <stop offset="0.72" stop-color="#101521" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#101521" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#CFD8F4"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9DB1FF"/>
      <stop offset="1" stop-color="#EBA0D7"/>
    </linearGradient>
    <filter id="previewShadow" x="-25%" y="-35%" width="150%" height="180%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#05070D" flood-opacity="0.72"/>
    </filter>
    <filter id="iconShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <clipPath id="previewClip">
      <rect x="520" y="130" width="712" height="380" rx="28"/>
    </clipPath>
  </defs>

  <rect width="1280" height="640" fill="url(#background)"/>
  <ellipse cx="890" cy="205" rx="520" ry="390" fill="url(#blueGlow)"/>
  <ellipse cx="1130" cy="560" rx="470" ry="330" fill="url(#pinkGlow)"/>

  <!-- Real QPlayer UI, shared by phone, tablet and desktop. -->
  <g filter="url(#previewShadow)">
    <rect x="510" y="120" width="732" height="400" rx="35" fill="#090B12"/>
    <rect x="518" y="128" width="716" height="384" rx="30" fill="#FFFFFF" fill-opacity="0.06"
          stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="2"/>
    <image href="screenshots/platform-showcase.png" x="520" y="130" width="712" height="380"
           preserveAspectRatio="xMidYMid slice" clip-path="url(#previewClip)"/>
  </g>

  <!-- Give the brand copy a quiet, high-contrast field over the preview. -->
  <rect width="710" height="640" fill="url(#leftFade)"/>

  <g filter="url(#iconShadow)">
    <image href="icon.png" x="64" y="76" width="104" height="104"/>
  </g>
  <text x="190" y="148" font-size="64" font-weight="800" letter-spacing="-2" fill="url(#wordmark)">
    <tspan fill="url(#accent)">Q</tspan><tspan>Player</tspan>
  </text>

  <text x="66" y="252" font-size="28" font-weight="700" fill="#F5F6FC">Music across every screen.</text>
  <text x="66" y="291" font-size="20" fill="#A9B2CC">QML-rendered · Android · Desktop</text>

  <g font-size="16" font-weight="700" fill="#DFE4F6">
    <g transform="translate(64 346)">
      <rect width="196" height="42" rx="21" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.16"/>
      <text x="98" y="27" text-anchor="middle">QML · Miuix</text>
    </g>
    <g transform="translate(272 346)">
      <rect width="196" height="42" rx="21" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.16"/>
      <text x="98" y="27" text-anchor="middle">OpenGL · Vulkan</text>
    </g>
    <g transform="translate(64 400)">
      <rect width="204" height="42" rx="21" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.16"/>
      <text x="102" y="27" text-anchor="middle">Android · Desktop</text>
    </g>
    <g transform="translate(280 400)">
      <rect width="208" height="42" rx="21" fill="#8FA5F2" fill-opacity="0.18" stroke="#AEBEFF" stroke-opacity="0.4"/>
      <text x="104" y="27" text-anchor="middle" fill="#EBEDFF">Powered by qml4j</text>
    </g>
  </g>

  <path d="M66 502 C108 482 144 522 186 502 S264 482 306 502 S384 522 426 502"
        fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
  <text x="66" y="552" font-size="16" letter-spacing="1.2" fill="#7F89A4">OPEN SOURCE · APACHE-2.0</text>
</svg>
