settings.automixMixTuning.title=其余调参（高级，键=值）
settings.automixMixTuning.desc=格式 键=值,键=值，留空 = 全默认。常用键：level_match（响度匹配，默认 1）、low_duck（低频让位，默认 1）、crossover/split（低音交接的分频点与时长）、cut_lead（出场点提前量）、cut_fade、hp_from/lp_to（可视化阈值）、outro_gain/intro_gain（明暗与力度）。注意 width / tempo_stretch / window_scale 三个键已由上面的控件负责，写在这里不生效（会报一行日志）。写错的键会退回全默认并报一行日志。
settings.automixAutoCue.title=自动点位
settings.automixAutoCue.desc=扫描本曲与下一首整曲，挑一处最接得上的位置开始融合（而不是固定用曲尾那几秒）。不会选到歌曲开头或完整结尾；一处都挑不出来时如实退回固定点位。代价是每次过渡前要多解一遍两首歌。
settings.automixCrossfade.title=交叉淡化时长
settings.automixCrossfade.desc=等功率淡化的窗口长度。0 等价于硬接；开着「自动点位」时它只是中心值——分析会在你这个值附近按两首歌的实际情况挑一个（你设的值仍是候选之一）
settings.automixHarmonic.title=声波重合时长
settings.automixHarmonic.desc=先判调性再把出场曲尾段转调到与进场曲相合的窗口长度；开着「自动点位」时她只是中心值，分析会按实际情况在它附近挑一个（你设的值仍是候选之一）
settings.automixVocalMode.title=融合期人声
settings.automixVocalMode.desc=融合阶段只合并背景声，过渡结束再把进场曲的人声渐恢复。DSP 是纯 Java 的中心声道抑制，不需要下载；AI 用 htdemucs 模型（按需下载），代价是峰值内存约 1.2 GB、分离耗时约等于窗口时长（8 秒窗口约 9 秒），窗口超过 15 秒时会超出预算并如实退回「不去人声」——表现模式在慢歌上就会这样
settings.automixVocalMode.desc.mobile=融合阶段只合并背景声，过渡结束再把进场曲的人声渐恢复。这里用 DSP（纯 Java 的中心声道抑制）：不需要下载、不占常驻内存。AI 模型那一档只在桌面提供
settings.automixVocalMode.off=不分离
settings.automixVocalMode.dsp=DSP
settings.automixVocalMode.ai=AI 模型

