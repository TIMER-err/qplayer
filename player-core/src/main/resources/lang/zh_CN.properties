settings.automixMode.model.missing=AI 模式需要 beat_this 拍点模型：尚未下载，现在会退回硬算（拍点质量会差一档，日志里会如实标注来源）。可在上方「模型」里下载。
settings.automixMode.gaplessNotice=注意：「无缝拼接」是默认档，它只决定在哪一帧拼接、不改写采样值——选它听不到任何交叠。想听到过渡请改选「交叉淡化 / 声波重合 / AI 模式」。
settings.automixVocalMode.model.ready=融合期人声由 {0} 模型分离（已就绪）：融合阶段只出声背景声，窗口末尾再把进场曲的人声渐恢复。
settings.automixVocalMode.model.missing=融合期人声选了 AI 模型，但 {0} 分轨模型尚未下载：现在会正常过渡但不去人声（不会改用 DSP 顶替，日志与过渡说明里都会如实标注）。可在上方「模型」里下载。

