settings.group.vocal=人声后期（融合期）
settings.vocal.autotune.title=修跑调（自动音准）
settings.vocal.autotune.desc=只作用在融合期分离出来的人声轨上（复音素材上的基频检测没有意义）。需要「去人声」选 AI（模型）那一档
settings.vocal.scale.title=音阶
settings.vocal.scale.desc=往哪儿修：半音 = 只做等程平均律微调；大调/小调/五声/蓝调会把不在音集里的音拉到最近的音级
settings.vocal.strength.title=修音强度
settings.vocal.strength.desc=修多少：100% = 完全拉到音上（很「电」），50% = 只修一半（留点人味）。实测 20% 压 3.7 dB、90% 压 8.9 dB 的尾巴（去混响那一档的判据）
settings.vocal.retune.title=回正速度
settings.vocal.retune.desc=修正量的时间常数：小 = 一发现就掰过去（电音），大 = 慢慢靠过去（像人）。这一档最影响听感
settings.vocal.vibrato.title=保留颤音
settings.vocal.vibrato.desc=修「平滑后的偏差」而不是瞬时偏差，于是颤音原样留着（关掉会把颤音一起拉平）
settings.vocal.dereverb.title=去混响
settings.vocal.dereverb.desc=谱减法去掉人声里的房间尾巴（只压尾巴，持续的音几乎不动）
settings.vocal.dereverbFloor.title=去混响噪声底
settings.vocal.dereverbFloor.desc=增益下限：谱减会把减到负数的频点归零，那听感是「水声」；留一个底让它衰减而不是消失
settings.studio.preset.title=曲线
settings.studio.open.title=音频工作室（工作站调音台）
settings.studio.open.button=打开
settings.studio.open.desc=实时频谱 + 拖拽调均衡曲线 + 音高/动态/立体声/染色 + 表头 + automix 控制室。下面那几行仍然有效（工作室页面里的改动会写回它们）
settings.automixManualCue.title=手动点位（控制室）
settings.automixManualCue.desc=直接指定融合点与切入点，覆盖自动点位/固定点位算出来的结论；开着时「手动说了算」
settings.automixManualOutro.title=出场曲融合点
settings.automixManualOutro.desc=出场曲从第几秒开始交叠（0 = 这一侧不覆盖）。被丢掉的尾巴会算进触发提前量：融合点真的落在曲中
settings.automixManualIntro.title=进场曲切入点
settings.automixManualIntro.desc=进场曲从第几秒进（0 = 这一侧不覆盖）；会夹到「曲子长度 − 窗口」，不给窗口留位置就不覆盖
settings.studio.preset.desc=一组就能听出来的均衡曲线；「关」= 直通（位完美不受影响）
settings.studio.rack.title=作用在哪一台
settings.studio.rack.desc=出场曲/进场曲那两台在过渡窗口里各自生效——A 轰、B 刺的时候分开修
settings.studio.gain.title=前级增益
settings.studio.gain.desc=整条链的输入增益；曲子之间响度差得远时用它对齐
settings.studio.loudness.title=等响度补偿
settings.studio.loudness.desc=音量小时按等响曲线补低频与高频（只作用于主总线；满音量时不补）
settings.studio.custom.title=自定义（JSON）
settings.studio.custom.desc=高级：整条链的完整参数。填了它就以它为准（按上面的「作用在哪一台」只覆盖那一台）
settings.studio.pitch.title=音高（移调）
settings.studio.gate.title=噪声门
settings.studio.gate.desc=门限以下的信号按范围衰减（先关门再压缩，否则压缩器会把底噪一起抬上来）
settings.studio.gateThreshold.title=门限
settings.studio.gateThreshold.desc=低过这条线就关门；门限以上原样通过（2 ms 开、80 ms 关、50 ms 保持）
settings.studio.comp.title=压缩器
settings.studio.comp.desc=阈值以上按比率收窄动态（6 dB 软拐点）；表头读数与定义逐条对过（±0.2 dB）
settings.studio.compThreshold.title=压缩阈值
settings.studio.compThreshold.desc=开始压缩的电平
settings.studio.compRatio.title=压缩比
settings.studio.compRatio.desc=4:1 = 阈值以上每 4 dB 只放 1 dB 过去
settings.studio.compAttack.title=启动
settings.studio.compAttack.desc=增益衰减的一阶时间常数（实测与旋钮一致：20 ms 旋钮在 20.0 ms 到达常数的那个点）
settings.studio.compRelease.title=释放
settings.studio.compRelease.desc=衰减恢复的时间常数；太短会「抽气」
settings.studio.compMakeup.title=补偿增益
settings.studio.compMakeup.desc=压完之后的整体抬升（压得越多越要补）
settings.studio.limiter.title=限制器
settings.studio.limiter.desc=天花板 + 2 ms 前视的硬限制：任何输入下输出峰值都不越过天花板（实测 0.03 dB 以内）。它引入 2 ms 延迟，如实计入延迟账
settings.studio.limiterCeiling.title=天花板
settings.studio.limiterCeiling.desc=输出的最高电平（−1 dBFS 是常见的安全线）
settings.studio.stereo.title=立体声工具
settings.studio.stereo.desc=宽度 / 低音单声道 / 耳机交叉馈送
settings.studio.stereoWidth.title=宽度
settings.studio.stereoWidth.desc=0% = 完全单声道，100% = 原样，200% = 侧信号翻倍（实测精确翻倍）
settings.studio.bassMono.title=低音单声道
settings.studio.bassMono.desc=这个频率以下的侧信号归零（Linkwitz-Riley 4 阶：200 Hz 时 50 Hz 压 48 dB、1 kHz 只差 0.02 dB）。耳机里低频不再左右晃
settings.studio.crossfeed.title=耳机交叉馈送
settings.studio.crossfeed.desc=把对侧信号低通 + 衰减 + 延迟一点送过来（模拟头挡住的那部分），耳机听老录音最有用
settings.studio.saturation.title=染色（饱和）
settings.studio.saturation.desc=波形整形带来谐波（tanh / 软削波 / 折线）；非线性会产生折叠，所以下面那一档过采样必须一起看
settings.studio.saturationDrive.title=驱动
settings.studio.saturationDrive.desc=进整形器之前的增益（实测 THD：3 dB → 1.1%，12 dB → 6.7%，24 dB → 29.9%）
settings.studio.saturationCurve.title=曲线
settings.studio.saturationCurve.desc=tanh（奇次谐波，磁带味）/ 软削波（更硬）/ 折线（二极管，奇偶次都有）
settings.studio.saturationOversample.title=过采样
settings.studio.saturationOversample.desc=把整形放到 2×/4× 域里做，谐波不再折叠回可听段：实测 7 kHz 的五次谐波折叠（13 kHz）开关差 32 dB
settings.studio.pitch.desc=按「作用在哪一台」整条移调：出场曲降半音这种用法在自动混音里很常见。开了会多一个 21 ms 的延迟（如实计入延迟账）
settings.studio.pitchSemitone.title=半音
settings.studio.pitchSemitone.desc=改调用这一档：±12 半音；与下面的音分相加才是最终音高（合计 ±13 半音）
settings.studio.pitchCents.title=音分微调
settings.studio.pitchCents.desc=精细对齐用（±100 音分 = ±1 半音）：分轨之间差 8 音分这种事只有音分看得见
settings.studio.pitchMix.title=干湿
settings.studio.pitchMix.desc=原声与移调声的比例：100% = 全移调，0% = 原样（逐位直通）。中间值听起来像合唱
