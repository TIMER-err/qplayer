settings.keepScreenOn.title=播放页常亮
settings.keepScreenOn.desc=播放时屏幕不自动熄灭，播放页和凝彩页都适用；暂停后按系统休眠时间息屏。两个页面里也各有同名按钮

settings.hifiBitPerfect.title=位完美直通
settings.hifiBitPerfect.desc=输出采样率与源一致且全程不做增益与重采样，比特原样送到音频引擎。歌曲主体逐采样成立；切歌过渡的那几秒会放弃（过渡必须改写采样值）
settings.hifiRateFollow.title=随曲切换采样率
settings.hifiRateFollow.desc=换曲时把输出流切到新源的采样率（如 44.1k → 48k）。关闭则无缝优先：另一首会被重采样
settings.automixEnabled.title=自动混音
settings.automixEnabled.desc=总开关。关：换曲不做过渡——两首不交叠、也不做任何分析（换曲点仍由引擎无缝拼接，不断流）；开：才按下面选的那一档接法做过渡。过渡还要提前拿到下一首——在线歌曲得先把音频落到本地缓存里，拿不到时照样没有交叠（日志里会写明是哪一种原因）
settings.automixStatus.off=已关闭：不做过渡（不交叠、不分析），换曲点无缝拼接
settings.automixStatus.gapless=已开启，但接法选的是「无缝拼接」：它同样不交叠、不做分析
settings.automixStatus.window=已开启：{0}，窗口 {1} s
settings.automixStatus.ai=已开启：{0}（窗口由分析结论决定）
settings.automixStatus.autoCue=（自动点位：融合点由整曲扫描决定，不再是曲尾那几秒）
settings.automixMode.title=过渡接法
settings.automixMode.desc=总开关打开时，每次切歌那一次过渡怎么做。它只管接缝，与歌曲主体是否位完美是两件事
