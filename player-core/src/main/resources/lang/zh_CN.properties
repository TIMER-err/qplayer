settings.outputDevice.title=播放设备
settings.outputDevice.desc=声音从哪台设备出来；「系统默认」跟随系统设置。换设备时当前这首会从头几秒处重开
settings.outputDevice.systemDefault=系统默认
toast.outputDevice.switched=已切换到「{0}」
toast.outputDevice.nextPlay=已切换到「{0}」，下一次播放生效
settings.automixBlendWidth.title=空间展宽（融合期）
settings.automixBlendWidth.desc=重叠的那几秒把出场曲推向两侧，让两首歌不在正中间打架。0% = 关（两首都留在正中间，最容易被听出「叠着两首」）、50% = 一半（默认，你自己挑的那一档）、100% = 完全推到两边（分得最开，但头中定位会偏）。
settings.automixTempoStretch.title=过渡期变速（鼓点对齐）
settings.automixTempoStretch.desc=把出场曲那几秒的素材变速到进场曲的拍长，两边的鼓点踩在一起、不滑（WSOLA，只作用在重叠窗口里，不改原曲、不改播放速度）。关掉就回到各按自己的拍走——两边 BPM 差得越多越容易听出来。默认开。
settings.automixWindowScale.title=融合窗口长度
settings.automixWindowScale.desc=重叠时长相对默认档（约 6.5 秒）的倍数。越长越有地方把过渡铺开、越不容易听出「啪一下换歌」，但两首叠在一起的时间也越长。50% = 约 3 秒、100% = 约 6.5 秒（默认）、200% = 约 13 秒。
settings.automixDiagnosticLog.title=过渡诊断日志（排查用）
settings.automixDiagnosticLog.desc=打开后每次换曲会把过程细节原样打进日志（拍栅格来源、窗口候选排名、去人声曲线形状、准备余量调整、分轨耗时…），一次几十行。默认关：正常听歌只看摘要。真正的问题（扫描失败、分离失败、交接不连续）不论开关如何都是警告，一条不会少。
