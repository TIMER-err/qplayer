settings.automixStyle.danceRepeater=Dance repeater
settings.automixStyle.gapless=Gapless
settings.automixStyle.splice=Splice
settings.automixMixTuning.title=Other tuning (advanced, key=value)
settings.automixMixTuning.desc=Format key=value,key=value; empty means all defaults. Common keys: level_match (default 1), low_duck (default 1), crossover/split, cut_lead, cut_fade, hp_from/lp_to, outro_gain/intro_gain. Note width / tempo_stretch / window_scale are owned by the controls above; writing them here has no effect (one log line says so). A bad key falls back to all defaults and logs one line.
settings.automixAutoCue.title=Auto cue point
settings.automixAutoCue.desc=Scan both tracks in full and start the mixdown at the seam that fits best, instead of always using the last few seconds. Never picks the very start or the very end; falls back to the fixed window when no seam qualifies. Costs one extra full decode of each track before every transition.
settings.automixCrossfade.title=Crossfade length
settings.automixCrossfade.desc=Window of the equal-power fade. 0 is a hard join; with auto cue on this is only the centre value — the analysis picks one near it for these two tracks (your value stays a candidate)
settings.automixHarmonic.title=Harmonic blend length
settings.automixHarmonic.desc=Window over which the outro is pitch-shifted to match the intro's key; with auto cue on this is only the centre value and the analysis picks near it (your value stays a candidate)
settings.automixVocalMode.title=Vocals while blending
settings.automixVocalMode.desc=Blend only the backing, then fade the incoming vocals back in as the window ends. DSP is pure-Java centre-channel suppression and needs no download; AI uses the htdemucs model (downloaded on demand) and costs about 1.2 GB of peak memory and roughly one second of separation per second of window (about 9 s for an 8 s window). Windows longer than 15 s overrun the budget and fall back to keeping the vocals, with the log and the transition note saying so — the build-up style does that on slow tracks
settings.automixVocalMode.desc.mobile=Blend only the backing, then fade the incoming vocals back in as the window ends. This uses DSP (pure-Java centre-channel suppression): nothing to download, no resident memory. The AI model is desktop-only
settings.automixVocalMode.off=Off
settings.automixVocalMode.dsp=DSP
settings.automixVocalMode.ai=AI model

