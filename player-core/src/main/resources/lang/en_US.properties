settings.automixBlendWidth.title=Spatial spread (during blend)
settings.automixBlendWidth.desc=Push the outgoing track towards the sides during the overlap. 0% = off (both stay centred, easiest to hear two songs stacked), 50% = half (default), 100% = fully to the sides.
settings.automixTempoStretch.title=Tempo match during transition
settings.automixTempoStretch.desc=Stretch the outgoing window to the incoming track's beat length so the drums line up (WSOLA, window only; the file and playback speed are untouched). Off = each track keeps its own tempo. Default on.
settings.automixWindowScale.title=Blend window length
settings.automixWindowScale.desc=Overlap length as a multiple of the default (~6.5 s). Longer spreads the transition out, but keeps both songs together longer. 50% = ~3 s, 100% = ~6.5 s (default), 200% = ~13 s.
settings.automixDiagnosticLog.title=Transition diagnostics (troubleshooting)
settings.automixDiagnosticLog.desc=When on, each transition logs its internal detail (beat grid source, window candidate ranking, duck curve shape, prepare-margin changes, separation timing...), dozens of lines per switch. Off by default so normal listening shows only the summary. Real problems (scan/separate failures, discontinuous hand-off) stay warnings either way.
