settings.keepScreenOn.desc=Hold the screen awake while a track plays, on the player page and the Tempera page alike; a paused player sleeps after the system timeout. Both pages also carry a button for it

settings.hifiBitPerfect.title=Bit-perfect passthrough
settings.hifiBitPerfect.desc=Output stays at the source rate with no gain or resampling, so the bits reach the audio engine untouched. Holds sample by sample across a song; the few seconds of a transition give it up, because a transition has to rewrite samples
settings.hifiRateFollow.title=Follow the source rate
settings.hifiRateFollow.desc=Switch the output stream to the new track's sample rate (44.1k to 48k). Off favours gapless: the other track gets resampled
settings.automixEnabled.title=Automix
settings.automixEnabled.desc=Master switch. Off: track changes do not transition — nothing overlaps and no analysis runs at all (the join itself stays seamless, in the same output stream). On: transitions use the technique selected below. A transition also needs its next track up front — an online song has to reach the local cache first — and when it is not there nothing overlaps, with the reason in the log
settings.automixStatus.off=Off: no transition (no overlap, no analysis); the join stays seamless
settings.automixStatus.gapless=On, but the technique is "Gapless join": that one does not overlap or analyse either
settings.automixStatus.window=On: {0}, window {1} s
settings.automixStatus.ai=On: {0} (the window comes from the analysis)
settings.automixStatus.autoCue= (auto cue: the mixdown point is scanned, not the last few seconds)
settings.automixMode.title=Transition technique
settings.automixMode.desc=With the master switch on, what happens on each track change. It only governs the seam; whether the song body is bit-perfect is a separate question
settings.automixMode.gapless=Gapless join
settings.automixMode.crossfade=Crossfade
settings.automixMode.harmonic=Harmonic blend
settings.automixMode.ai=AI mode
settings.automixStyle.title=AI technique
settings.automixStyle.desc=How AI mode joins the two tracks. Automatic picks one from the tempo gap and key similarity
settings.automixStyle.auto=Automatic
settings.automixStyle.plainBlend=Plain blend
