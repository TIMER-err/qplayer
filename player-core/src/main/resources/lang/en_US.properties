settings.group.hifi=Bit-perfect & sample rate
settings.group.studio=Audio studio
settings.group.vocal=Vocal polish (transition)
settings.vocal.autotune.title=Pitch correction
settings.vocal.autotune.desc=Applies only to the vocal stem separated during a transition (f0 detection is meaningless on polyphonic material). Requires the AI stem mode
settings.vocal.scale.title=Scale
settings.vocal.scale.desc=Where to correct to: chromatic retunes to equal temperament only; major/minor/pentatonic/blues pull off-scale notes to the nearest degree
settings.vocal.strength.title=Correction amount
settings.vocal.strength.desc=How much to correct: 100% snaps fully onto the scale (very "auto-tuned"), 50% corrects halfway
settings.vocal.retune.title=Retune speed
settings.vocal.retune.desc=Time constant of the correction: small snaps instantly, large glides like a human
settings.vocal.vibrato.title=Keep vibrato
settings.vocal.vibrato.desc=Corrects the smoothed offset instead of the instantaneous one, so vibrato survives
settings.vocal.dereverb.title=Dereverb
settings.vocal.dereverb.desc=Spectral subtraction of the room tail from the vocal (only the tail is attenuated; sustained notes stay)
settings.vocal.dereverbFloor.title=Dereverb noise floor
settings.vocal.dereverbFloor.desc=Gain floor: hard spectral subtraction zeroes bins and sounds like water; a floor makes them decay instead
settings.studio.preset.title=Curve
settings.studio.open.title=Audio studio (workstation console)
settings.studio.open.button=Open
settings.studio.open.desc=Live spectrum, draggable EQ curve, pitch/dynamics/stereo/saturation, meters and the automix control room. The rows below still apply (edits in the studio page are written back to them)
settings.automixManualCue.title=Manual cue points (control room)
settings.automixManualCue.desc=Overrides the blend and entry points computed by auto cue / fixed points; when on, the manual values win
settings.automixManualOutro.title=Outgoing blend point
settings.automixManualOutro.desc=Second where the outgoing track starts to overlap (0 = leave this side alone). The dropped tail feeds the trigger lead, so the blend really happens mid-song
settings.automixManualIntro.title=Incoming entry point
settings.automixManualIntro.desc=Second where the incoming track enters (0 = leave this side alone); clamped to track length minus the window
settings.studio.preset.desc=A set of EQ curves you can hear in one pass; "Off" = bypass (bit-perfect stays intact)
settings.studio.rack.title=Applies to
settings.studio.rack.desc=The outgoing/incoming racks act inside the transition window, so a boomy A and a harsh B can be fixed separately
settings.studio.gain.title=Preamp
settings.studio.gain.desc=Input gain for the whole chain; use it to match tracks that differ a lot in loudness
settings.studio.loudness.title=Equal-loudness compensation
settings.studio.loudness.desc=Lifts lows and highs at low volume (master bus only; nothing at full volume)
settings.studio.custom.title=Custom (JSON)
settings.studio.custom.desc=Advanced: the full chain. When filled it wins (the "Applies to" row still picks which rack)
settings.studio.pitch.title=Pitch (transpose)
settings.studio.gate.title=Noise gate
settings.studio.gate.desc=Attenuates below the threshold (close the gate before compressing, or the compressor lifts the noise floor too)
settings.studio.gateThreshold.title=Gate threshold
settings.studio.gateThreshold.desc=Below this level the gate attenuates; above it passes untouched (2 ms open, 80 ms close, 50 ms hold)
settings.studio.comp.title=Compressor
settings.studio.comp.desc=Narrows the dynamics above the threshold with a 6 dB soft knee; the meter readings are checked against the definition (±0.2 dB)
settings.studio.compThreshold.title=Threshold
settings.studio.compThreshold.desc=Level where compression starts
settings.studio.compRatio.title=Ratio
settings.studio.compRatio.desc=4:1 means 4 dB above the threshold becomes 1 dB at the output
settings.studio.compAttack.title=Attack
settings.studio.compAttack.desc=First-order time constant of the gain reduction (measured to match the knob)
settings.studio.compRelease.title=Release
settings.studio.compRelease.desc=Recovery time constant; too short pumps
settings.studio.compMakeup.title=Makeup gain
settings.studio.compMakeup.desc=Overall lift after compression
settings.studio.limiter.title=Limiter
settings.studio.limiter.desc=Hard ceiling with 2 ms look-ahead: the output peak never crosses the ceiling (measured within 0.03 dB). Adds 2 ms of latency, reported honestly
settings.studio.limiterCeiling.title=Ceiling
settings.studio.limiterCeiling.desc=Maximum output level (−1 dBFS is a common safety line)
settings.studio.stereo.title=Stereo tools
settings.studio.stereo.desc=Width / bass mono / headphone crossfeed
settings.studio.stereoWidth.title=Width
settings.studio.stereoWidth.desc=0% = mono, 100% = unchanged, 200% = side doubled (measured exactly)
settings.studio.bassMono.title=Bass mono
settings.studio.bassMono.desc=Side content below this frequency is removed (Linkwitz-Riley 4th order: at 200 Hz, 50 Hz is 48 dB down while 1 kHz differs by 0.02 dB)
settings.studio.crossfeed.title=Headphone crossfeed
settings.studio.crossfeed.desc=Feeds a low-passed, attenuated, slightly delayed copy of the opposite channel (the head-shadow part)
settings.studio.saturation.title=Saturation
settings.studio.saturation.desc=Wave shaping adds harmonics (tanh / soft clip / diode); being non-linear it aliases, so watch the oversampling setting below
settings.studio.saturationDrive.title=Drive
settings.studio.saturationDrive.desc=Gain into the shaper (measured THD: 3 dB → 1.1%, 12 dB → 6.7%, 24 dB → 29.9%)
settings.studio.saturationCurve.title=Curve
settings.studio.saturationCurve.desc=tanh (odd harmonics, tape-like) / soft clip (harder) / diode (both even and odd)
settings.studio.saturationOversample.title=Oversampling
settings.studio.saturationOversample.desc=Runs the shaper at 2x/4x so harmonics do not fold back: measured 32 dB difference on the 5th harmonic of 7 kHz folding to 13 kHz
settings.studio.pitch.desc=Transposes the whole rack selected above (dropping the outgoing track a semitone is common in automix). Adds one 21 ms look-ahead, reported honestly as latency
settings.studio.pitchSemitone.title=Semitones
settings.studio.pitchSemitone.desc=Key change: ±12 semitones. Added to the cents below for the final pitch (±13 semitones total)
settings.studio.pitchCents.title=Fine tune (cents)
settings.studio.pitchCents.desc=For fine alignment (±100 cents = ±1 semitone): an 8-cent offset between stems is only visible in cents
settings.studio.pitchMix.title=Dry/Wet
settings.studio.pitchMix.desc=Blend between the original and the transposed signal: 100% = fully transposed, 0% = untouched (bit-exact bypass). In-between sounds like a chorus
